name: CI/CD Pipeline with Docker and Linter

on:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    name: Lint Code and Run Tests
    runs-on: self-hosted
    steps:
      - name: Update code via Git
        run: |
          cd /home/user
          if [ ! -d "myapp" ]; then
            git clone https://github.com/neebykotat/personal-finance-calculator.git myapp
          else
            cd myapp
            git pull origin main
          fi

      - name: Install dependencies
        run: |
          cd /home/user/myapp
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run Linter (Flake8)
        run: |
          cd /home/user/myapp
          source .venv/bin/activate
          flake8 . --exclude=.git,__pycache__,.venv,tests

      - name: Run tests
        run: |
          cd /home/user/myapp
          source .venv/bin/activate
          pytest -v

  build-docker:
    name: Build Docker Image and Deploy
    needs: test-and-lint
    runs-on: self-hosted
    steps:
      - name: Build Docker Image
        run: |
          cd /home/user/myapp
          sudo chmod 666 /var/run/docker.sock
          docker build -t finance-app:latest .

      - name: Run Application in Docker Container
        run: |
          docker stop finance-container || true
          docker rm finance-container || true

          docker run -d --name finance-container -it finance-app:latest

