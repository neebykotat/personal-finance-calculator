name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Test and Deploy
    runs-on: self-hosted
    steps:
      - name: Update code via Git
        run: |
          cd /home/user

          if [ ! -d "myapp" ]; then
            git clone https://github.com/neebykotat/personal-finance-calculator.git myapp
          else
            cd myapp
            git pull origin main
          fi

      - name: Install dependencies
        run: |
          cd /home/user/myapp
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd /home/user/myapp
          source .venv/bin/activate
          pytest -v
