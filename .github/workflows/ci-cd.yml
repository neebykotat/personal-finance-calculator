name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Pytest
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files to production folder
        run: |
          mkdir -p /home/user/myapp
          cp -r main.py finance.py requirements.txt /home/user/myapp/
          print("🚀 Деплой успешно завершен! Файлы обновлены в /home/user/myapp/")
